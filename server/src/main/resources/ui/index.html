<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MemScope</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="banner" class="banner" role="alert" hidden></div>

  <header class="topbar">
    <span class="brand">MemScope</span>
    <label class="field">Device
      <select id="device-select" disabled><option>Looking for devices…</option></select>
    </label>
    <button id="device-refresh" class="btn icon" type="button" title="Refresh the device list" aria-label="Refresh devices">&#8635;</button>
    <label class="field">App
      <select id="app-select" disabled><option>–</option></select>
    </label>
    <button id="app-refresh" class="btn icon" type="button" title="Refresh the app list" aria-label="Refresh apps">&#8635;</button>
    <label class="field" id="dump-process-field" hidden title="The app runs in several processes: pick the one to dump">Process
      <select id="dump-process"></select>
    </label>
    <button id="dump-btn" class="btn primary" type="button" disabled>Dump now</button>
    <button id="startup-btn" class="btn" type="button" disabled title="Restart the app under a debugger and dump its heap at startup milestones">Record startup</button>
    <button id="sessions-btn" class="btn" type="button" title="Recorded sessions and their size on disk: open or delete them">Sessions</button>
  </header>

  <div id="job-panel" class="job-panel" hidden aria-live="polite"></div>

  <section id="timeline" aria-label="Memory timeline"></section>

  <div class="snaprow">
    <label class="field">Snapshot
      <select id="snapshot-select" disabled><option>No snapshots yet</option></select>
    </label>
    <button id="snapshot-delete" class="btn small" type="button" disabled title="Delete the selected snapshot (its heap dump and analysis files)">Delete snapshot</button>
    <div class="compare">
      <label class="check" title="Show what changed since another snapshot of this session (in a startup recording: since the previous milestone)"><input id="compare-on" type="checkbox" disabled> Compare with</label>
      <select id="compare-select" aria-label="Snapshot to compare with" disabled><option value="">none</option></select>
    </div>
  </div>

  <div class="tabsrow">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" id="tab-tree" type="button">Tree</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-classes" type="button">Classes</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-findings" type="button">Findings <span id="findings-badge" class="badge" hidden></span></button>
    </div>
    <div class="controls">
      <div class="search">
        <input id="search" type="search" placeholder="Find class (e.g. LeakyActivity)" autocomplete="off" aria-label="Search class name" disabled>
        <ul id="search-list" class="search-list" role="listbox" hidden></ul>
      </div>
      <label class="check" title="Hide the ~35 MB of zygote / boot-image objects that every Android process shares. Sizes then count only your app's heap."><input id="hide-system" type="checkbox" checked> Hide system heap</label>
      <label class="check" title="Dim rows whose class is not in your app's packages"><input id="my-code" type="checkbox"> My code</label>
    </div>
  </div>

  <main class="main">
    <section class="treepane" aria-label="Heap tree">
      <div id="summary" class="summary"></div>
      <div id="compare-line" class="compare-line" aria-live="polite" hidden></div>
      <div id="search-banner" class="search-banner" hidden></div>
      <div id="tree" class="tree"></div>
      <div id="classes" class="classes" hidden></div>
      <div id="findings" class="findings" hidden></div>
    </section>
    <aside id="details" class="details" aria-label="Details"></aside>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
