<!doctype html>
<meta charset="utf-8"><title>MemScope selftest</title>
<body style="font:14px monospace"><pre id="out"></pre>
<script type="module">
import { shareInFlight, formatBytes, formatPercent, splitClassName, refKind, hasObjectDetails, rowSize, rowPercent, rowVisible, sortRows } from './util.js';
import { downsample, niceStep, timeStep, heldBands, capSamples, nearestIndex } from './timeline.js';
import { buildRows, sortAndFilter } from "./classes.js";
import { formatDeltaBytes, formatDeltaInt, indexDiff, rootDelta, rootLabelOf } from "./util.js";
const out = document.getElementById('out');
let fails = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) fails++;
  out.textContent += (ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : ' got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)) + '\n';
}
eq('0 B', formatBytes(0), '0 B');
eq('512 B', formatBytes(512), '512 B');
eq('1 KB', formatBytes(1024), '1.0 KB');
eq('1.5 KB', formatBytes(1536), '1.5 KB');
eq('promote 1023.99 KB', formatBytes(1024 * 1023.99), '1.0 MB');
eq('20 MB', formatBytes(20 * 1024 * 1024), '20.0 MB');
eq('2.5 GB', formatBytes(2.5 * 1024 ** 3), '2.5 GB');
eq('null', formatBytes(null), '–');
eq('pct', formatPercent(61.234), '61.2%');
eq('pct tiny', formatPercent(0.01), '<0.1%');
eq('pct zero', formatPercent(0), '0.0%');
eq('split', splitClassName('java.util.HashMap$Node'), { simple: 'HashMap$Node', pkg: 'java.util' });
eq('split array', splitClassName('byte[]'), { simple: 'byte[]', pkg: '' });
eq('split app array', splitClassName('dev.x.Foo[]'), { simple: 'Foo[]', pkg: 'dev.x' });
eq('kind root', refKind('root'), 'root');
eq('kind grp', refKind('grp:obj:3|7'), 'grp');
eq('details obj', hasObjectDetails('obj:3'), true);
eq('details cat', hasObjectDetails('cat:static'), false);
eq('details grp', hasObjectDetails('grp:cat:other|2'), false);
const r = (retained, app) => ({ retainedBytes: retained, appHeapBytes: app, percentOfHeap: retained / 10 });
eq('size hide', rowSize(r(100, 40), true), 40);
eq('size show', rowSize(r(100, 40), false), 100);
eq('percent hide', rowPercent(r(100, 40), true, { appHeapBytes: 80 }), 50);
eq('percent show', rowPercent(r(100, 40), false, { appHeapBytes: 80 }), 10);
eq('visible', [rowVisible(r(5, 0), true), rowVisible(r(5, 0), false)], [false, true]);
eq('sort', sortRows([r(9, 1), r(5, 5), r(7, 5)], true).map((x) => x.retainedBytes), [5, 7, 9]);
const smp = (t, total, paused = false) => ({ tMs: t, totalPssKb: total, paused });
eq('downsample keeps small input', downsample([smp(1, 1), smp(2, 2)], 600).length, 2);
{
  const big = Array.from({ length: 3600 }, (_, i) => smp(i * 1000, i === 1234 ? 99999 : i));
  const d = downsample(big, 600);
  eq('downsample caps points', d.length, 600);
  eq('downsample keeps the peak', d.some((s) => s.totalPssKb === 99999), true);
  eq('downsample keeps order', d.every((s, i) => i === 0 || s.tMs > d[i - 1].tMs), true);
}
eq('niceStep 100 MB', niceStep(100), 50);
eq('niceStep 62 MB', niceStep(62), 25);
eq('niceStep 0', niceStep(0), 1);
eq('timeStep 30 s', timeStep(30), 5);
eq('timeStep 1 h', timeStep(3600), 600);
eq('heldBands closed and open', heldBands([{ startMs: 1000, endMs: 3000 }, { startMs: 4000 }], 4500), [[1000, 3000], [4000, 4500]]);
{
  const many = Array.from({ length: 9000 }, (_, i) => smp(i * 1000, i === 10 ? 99999 : i));
  const c = capSamples(many);
  eq('capSamples bounds the array', c.length <= 5000, true);
  eq('capSamples keeps the newest exactly', c.slice(-1000).map((x) => x.tMs), many.slice(-1000).map((x) => x.tMs));
  eq('capSamples keeps old peaks', c.some((x) => x.totalPssKb === 99999), true);
}
eq('nearestIndex', [nearestIndex([smp(0, 1), smp(1000, 1), smp(2000, 1)], 1400), nearestIndex([smp(0, 1), smp(1000, 1)], 5000), nearestIndex([smp(0, 1), smp(1000, 1)], 0)], [1, 1, 0]);
{
  let starts = 0;
  const holder = { loading: null };
  const start = () => { starts++; return new Promise((r) => setTimeout(() => r(starts), 20)); };
  const [a, b] = await Promise.all([shareInFlight(holder, start), shareInFlight(holder, start)]);
  eq("in-flight shared: one start, same result", [starts, a, b], [1, 1, 1]);
  eq("holder cleared after settle", holder.loading, null);
  await shareInFlight(holder, start);
  eq("new call after settle starts again", starts, 2);
  const failing = { loading: null };
  await shareInFlight(failing, () => Promise.reject(new Error("x"))).catch(() => {});
  eq("holder cleared after rejection", failing.loading, null);
}
{
  // snapshot diff helpers
  eq("delta bytes", [formatDeltaBytes(0), formatDeltaBytes(1536), formatDeltaBytes(-2048)], ["0", "+1.5 KB", "\u22122.0 KB"]);
  eq("delta int", [formatDeltaInt(0), formatDeltaInt(1234), formatDeltaInt(-7)], ["0", "+1,234", "\u22127"]);
  const stat = (n, c, s, r, app) => ({ className: n, instanceCount: c, shallowBytes: s, retainedBytes: r, isAppCode: false, appInstanceCount: app, appShallowBytes: app * 10, appRetainedBytes: app * 20 });
  const delta = (n, cb, ca, app) => ({ className: n, isAppCode: false, countBefore: cb, countAfter: ca, shallowBefore: cb * 10, shallowAfter: ca * 10, retainedBefore: cb * 20, retainedAfter: ca * 20,
    appCountBefore: app[0], appCountAfter: app[1], appShallowBefore: app[0] * 10, appShallowAfter: app[1] * 10, appRetainedBefore: app[0] * 20, appRetainedAfter: app[1] * 20 });
  const diff = indexDiff({ classes: [delta("grown", 2, 5, [2, 5]), delta("fresh", 0, 3, [0, 3]), delta("vanished", 4, 0, [4, 0])], roots: [{ label: "Static fields", retainedBefore: 10, retainedAfter: 50, appRetainedBefore: 4, appRetainedAfter: 9 }], reachableBefore: 0, reachableAfter: 0, appHeapBefore: 0, appHeapAfter: 0 });
  const classes = [stat("grown", 5, 50, 100, 5), stat("fresh", 3, 30, 60, 3), stat("same", 7, 70, 140, 7), stat("sysonly", 9, 90, 180, 0)];
  const rows = buildRows(classes, diff, true);
  eq("hide system drops classes without app instances", rows.map((r) => r.className), ["grown", "fresh", "same", "vanished"]);
  eq("grown deltas", rows.find((r) => r.className === "grown"), { className: "grown", isApp: false, count: 5, shallow: 50, retained: 100, dCount: 3, dShallow: 30, dRetained: 60, isNew: false, gone: false });
  eq("new class", rows.find((r) => r.className === "fresh").isNew, true);
  eq("unchanged class has zero deltas", rows.find((r) => r.className === "same").dRetained, 0);
  eq("vanished class", rows.find((r) => r.className === "vanished"), { className: "vanished", isApp: false, count: 0, shallow: 0, retained: 0, dCount: -4, dShallow: -40, dRetained: -80, isNew: false, gone: true });
  eq("system numbers when shown", buildRows(classes, diff, false).find((r) => r.className === "grown").dRetained, 3 * 20);
  eq("no diff: no deltas, sysonly kept when shown", buildRows(classes, null, false).map((r) => [r.className, r.dRetained]), [["grown", 0], ["fresh", 0], ["same", 0], ["sysonly", 0]]);
  eq("sort by delta desc, ties by name", sortAndFilter(rows, { filter: "", key: "dRetained", dir: "desc" }).map((r) => r.className), ["fresh", "grown", "same", "vanished"]);
  eq("filter is a case-insensitive substring", sortAndFilter(rows, { filter: "RES", key: "name", dir: "asc" }).map((r) => r.className), ["fresh"]);
  eq("root label of a category", rootLabelOf({ kind: "CATEGORY", label: "Static fields" }), "Static fields");
  eq("root label of class statics", rootLabelOf({ kind: "CLASS_STATICS", label: "x.Y", className: "x.Y" }), "Static fields / x.Y");
  eq("deeper rows have no root label", rootLabelOf({ kind: "OBJECT", label: "x.Y" }), null);
  eq("root delta app / all", [rootDelta(diff, "Static fields", true), rootDelta(diff, "Static fields", false), rootDelta(diff, "nope", true)], [5, 40, null]);
}
out.textContent += fails ? '\n' + fails + ' FAILED' : '\nALL PASSED';
document.title = fails ? 'selftest FAIL' : 'selftest OK';
</script>
